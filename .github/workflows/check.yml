name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: every entry is as it says, every zip downloaded and checked
        run: python3 tools/validate.py
      - name: index.json is up to date
        run: python3 tools/build_index.py --check
